name: Build WG CW v2.2.6 Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wg-cw-v226

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Xiaozhi v2.2.6 LCD 240x240
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          python scripts/release.py bread-compact-wifi-lcd --name bread-compact-wifi-lcd-240x240
          test -s build/merged-binary.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: WG-CW-v226-Original-240x240
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 14
